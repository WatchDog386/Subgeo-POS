# nginx reverse proxy for pos.subgeoholding.com -> local app on :8787
# Installed by deploy/host.sh (installs into /etc/nginx/sites-available/subgeo-pos).
#
# Before running host.sh, DNS must be live:
#   pos.subgeoholding.com  ->  this server's public IPv4 (A record)

server {
    listen 80;
    listen [::]:80;
    server_name pos.subgeoholding.com;

    # Safety: nginx must not try to serve anything else if the app is down
    location = /health-probe { return 200 "nginx ok\n"; }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSocket upgrade (Vite dev / future features) + real client IP
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Umbuka POS payloads are small, but keep uploads sane
        client_max_body_size 25m;

        # M-Pesa callbacks are quick; websockets/streams get slack
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets come out of dist/ heavily cached by the browser via hashes
    location /assets/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
